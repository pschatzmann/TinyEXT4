name=TinyEXT4
version=0.1.0
author=Phil Schatzmann
maintainer=Phil Schatzmann <phil.schatzmann@gmail.com>
sentence=Header only ext2/ext3/ext4 file system (without journaling) for microcontrollers.
paragraph=Reads ext2/3/4 (extents, htree, 64bit, flex_bg, metadata_csum) and writes ext4 without journal with a few KB of RAM. Drivers for SD cards (SPI, ESP32 SDMMC), RAM disks, NBD (TinyNBD) and USB MSC. Can be built and tested on the desktop with CMake.
category=Data Storage
